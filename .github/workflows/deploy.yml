name: Deploy to Selectel S3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq awscli

      - name: Configure AWS credentials
        run: |
          aws configure set aws_access_key_id "${{ secrets.S3_ACCESS_KEY_ID }}"
          aws configure set aws_secret_access_key "${{ secrets.S3_SECRET_ACCESS_KEY }}"
          aws configure set default.region "ru-3"

      - name: Deploy to S3
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --endpoint-url "${{ secrets.S3_ENDPOINT }}" \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".DS_Store" \
            --exclude "*.md"
