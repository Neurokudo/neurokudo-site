name: Deploy to Selectel S3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      - name: Configure rclone
        run: |
          mkdir -p ~/.config/rclone
          cat > ~/.config/rclone/rclone.conf << EOF
          [selectel]
          type = s3
          provider = Other
          access_key_id = ${{ secrets.S3_ACCESS_KEY_ID }}
          secret_access_key = ${{ secrets.S3_SECRET_ACCESS_KEY }}
          endpoint = s3.ru-3.storage.selcloud.ru
          force_path_style = true
          EOF

      - name: Deploy assets to S3
        run: |
          rclone sync . selectel:${{ secrets.S3_BUCKET }} \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --exclude ".DS_Store" \
            --exclude "*.md" \
            --exclude "*.html" \
            --header-upload "Cache-Control: public, max-age=86400" \
            --s3-no-check-bucket \
            -v

      - name: Bust CDN cache — delete HTML then re-upload
        run: |
          rclone delete selectel:${{ secrets.S3_BUCKET }}/index.html \
            --s3-no-check-bucket -v || true
          sleep 3
          rclone copy . selectel:${{ secrets.S3_BUCKET }} \
            --include "*.html" \
            --header-upload "Cache-Control: no-cache, no-store, must-revalidate" \
            --s3-no-check-bucket \
            -v
