name: Deploy to Selectel S3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: pip install awscli

      - name: Debug - test S3 connection
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-3
        run: |
          echo "Testing S3 connection..."
          echo "Endpoint: ${{ secrets.S3_ENDPOINT }}"
          echo "Bucket: ${{ secrets.S3_BUCKET }}"
          aws s3 ls --endpoint-url "${{ secrets.S3_ENDPOINT }}" 2>&1 || true
          echo "---"
          aws s3 ls "s3://${{ secrets.S3_BUCKET }}" --endpoint-url "${{ secrets.S3_ENDPOINT }}" 2>&1 || true
          echo "---"
          aws s3api head-bucket --bucket "${{ secrets.S3_BUCKET }}" --endpoint-url "${{ secrets.S3_ENDPOINT }}" 2>&1 || true

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-3
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --endpoint-url "${{ secrets.S3_ENDPOINT }}" \
            --acl public-read \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".DS_Store" \
            --exclude "*.md"
