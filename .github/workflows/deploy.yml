name: Deploy to Selectel S3

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install AWS CLI
        run: pip install awscli

      - name: Set bucket policy (public read)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-3
        run: |
          cat > /tmp/policy.json << POLICY
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Sid": "PublicRead",
                "Effect": "Allow",
                "Principal": "*",
                "Action": "s3:GetObject",
                "Resource": "arn:aws:s3:::${{ secrets.S3_BUCKET }}/*"
              }
            ]
          }
          POLICY
          aws s3api put-bucket-policy \
            --bucket "${{ secrets.S3_BUCKET }}" \
            --policy file:///tmp/policy.json \
            --endpoint-url "${{ secrets.S3_ENDPOINT }}"

      - name: Deploy to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ru-3
        run: |
          aws s3 sync . "s3://${{ secrets.S3_BUCKET }}" \
            --endpoint-url "${{ secrets.S3_ENDPOINT }}" \
            --acl public-read \
            --delete \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".DS_Store" \
            --exclude "*.md"
